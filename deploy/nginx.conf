server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 210k;
  }
}
